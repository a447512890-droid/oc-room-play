<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修复游戏加载</title><body style="background:#f7fbff;color:#42627a;font:18px sans-serif;padding:32px;line-height:1.7"><h2>修复游戏加载</h2><p id="status">点击后停用旧离线缓存，重新加载游戏。不会删除最高分和房间存档。</p><button id="repair" style="font:inherit;padding:14px 24px;background:#dceefa;border:1px solid #91bddb;border-radius:16px">修复并打开游戏</button><script>document.getElementById('repair').onclick=async function(){this.disabled=true;try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();for(const registration of registrations){if(registration.scope.startsWith(new URL('./',location.href).href))await registration.unregister();}}if('caches' in window){for(const key of await caches.keys()){if(key.includes('-sw-cache-'))await caches.delete(key);}}location.replace('./index.html?online=1&repair='+Date.now());}catch(e){document.getElementById('status').textContent='修复未完成：'+e.message;this.disabled=false;}};</script></body></html>
